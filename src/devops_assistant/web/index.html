<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI DevOps Assistant</title>
  <link rel="stylesheet" href="/assets/console.css">
  <script>document.documentElement.lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "zh-CN";</script>
</head>
<body>
  <div class="shell" data-shell="studio">
    <header class="top">
      <div class="brand"><span class="mark">DA</span><div><strong>AI DevOps Assistant</strong><small><span class="zh">日志只分类，不执行命令</span><span class="en">Classify logs, run nothing</span></small></div></div>
      <nav class="lang"><button type="button" data-lang="zh">中文</button><button type="button" data-lang="en">English</button></nav>
    </header>
    <main class="layout">
      <section class="panel">
<p class="note"><span class="zh">密钥会先打码。页面没有执行命令的按钮。</span><span class="en">Secrets are redacted first. This page cannot run commands.</span></p>
<label><span class="zh">仓库名</span><span class="en">Repository</span></label>
<input id="repository" value="demo/app">
<label><span class="zh">日志</span><span class="en">Log</span></label>
<textarea id="log">FAILED tests/test_api.py::test_health
AssertionError: expected 200</textarea>
<label><span class="zh">记录编号</span><span class="en">Record id</span></label>
<input id="item" placeholder="id">
<div class="actions">
  <button class="primary" id="diagnose" type="button"><span class="zh">分类</span><span class="en">Classify</span></button>
  <button id="history" type="button"><span class="zh">历史</span><span class="en">History</span></button>
  <button id="groups" type="button"><span class="zh">归并</span><span class="en">Groups</span></button>
  <button id="open" type="button"><span class="zh">打开一条</span><span class="en">Open one</span></button>
</div>
</section>
      <section class="panel"><pre id="out" class="out"></pre></section>
    </main>
  </div>
  <script src="/assets/console.js"></script>
  <script src="/assets/page.js"></script>
</body>
</html>
